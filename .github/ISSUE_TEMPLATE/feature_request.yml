name: Feature request
description: Suggest a feature, effect or workflow improvement
body:
  - type: textarea
    id: use_case
    attributes:
      label: What would you like to do?
      description: Describe the creative use case and the current limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Example command, configuration or visual reference.
