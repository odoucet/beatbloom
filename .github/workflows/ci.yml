name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.19"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --extra plot --dev --python 3.12
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ruff check .
      - run: uv run --locked mypy
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: make editor-test
      - run: uv build
      - name: Test installed wheel outside the checkout
        run: |
          uv venv /tmp/beatbloom-wheel --python 3.12
          uv pip install --python /tmp/beatbloom-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/beatbloom-wheel/bin/beatbloom --version
          /tmp/beatbloom-wheel/bin/python -m beatbloom --help

  tests:
    name: Python ${{ matrix.python }} on Linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.19"
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --locked --extra plot --dev --python ${{ matrix.python }}
      - run: ffmpeg -version
      - run: uv run --locked pytest --cov=beatbloom --cov-report=term-missing

  portable:
    name: Unit tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.19"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --extra plot --dev --python 3.12
      - run: uv run --locked pytest -m "not integration"

  demucs:
    name: Optional Demucs CPU backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.19"
          enable-cache: true
      - run: uv python install 3.12
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --locked --dev --python 3.12
      - name: Test locked Demucs dependencies with the matching CPU PyTorch build
        run: |
          uv export --locked --extra demucs --no-dev --no-hashes --no-annotate --no-emit-project -o /tmp/demucs-full.txt
          uv export --locked --extra demucs --no-dev --no-hashes --no-emit-project --prune torch -o /tmp/demucs-cpu.txt
          .venv/bin/python - <<'PY'
          import subprocess
          from pathlib import Path
          from packaging.requirements import Requirement

          candidates = []
          for line in Path("/tmp/demucs-full.txt").read_text().splitlines():
              if line.startswith("torch=="):
                  requirement = Requirement(line)
                  if requirement.marker is None or requirement.marker.evaluate():
                      candidates.append(next(iter(requirement.specifier)).version)
          assert len(candidates) == 1, candidates
          subprocess.run([
              "uv", "pip", "install", "--python", ".venv/bin/python",
              f"torch=={candidates[0]}+cpu", "--index-url", "https://download.pytorch.org/whl/cpu",
          ], check=True)
          PY
          uv pip install --python .venv/bin/python --no-deps -r /tmp/demucs-cpu.txt
          uv pip check --python .venv/bin/python
      - run: .venv/bin/python -m pytest -m demucs_runtime
